{% extends 'base.html' %}
{% block content %}
<h2>{{ page_title }}</h2>
<table class="table">
    <thead><tr><th>Ward</th><th>Beds</th><th>Occupied</th></tr></thead>
    <tbody>
    {% for w in wards %}
    <tr><td>{{ w.name }}</td><td>{{ w.beds }}</td><td>{{ w.occupied }}</td></tr>
    {% endfor %}
    </tbody>
</table>
{% endblock %}
