<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title or 'MediCore HMS' }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #f8fafc; }
        .sidebar { background: #22314A; color: white; min-height: 100vh; }
        .sidebar .btn { color: white; text-align: left; width: 100%; margin-bottom: 8px; }
        .sidebar .btn.active, .sidebar .btn:focus { background: #1EB980; }
        .quick-action { margin-bottom: 10px; }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <div class="col-2 sidebar p-4">
            <h4 class="mb-4">MediCore HMS</h4>
            <a href="/" class="btn btn-outline-light {% if active_page == 'dashboard' %}active{% endif %}">Dashboard</a>
            <a href="/patients" class="btn btn-outline-light {% if active_page == 'patients' %}active{% endif %}">Patient Management</a>
            <a href="/appointments" class="btn btn-outline-light {% if active_page == 'appointments' %}active{% endif %}">Appointments</a>
            <a href="/pharmacy" class="btn btn-outline-light {% if active_page == 'pharmacy' %}active{% endif %}">Pharmacy</a>
            <a href="/laboratory" class="btn btn-outline-light {% if active_page == 'laboratory' %}active{% endif %}">Laboratory</a>
            <a href="/wards" class="btn btn-outline-light {% if active_page == 'wards' %}active{% endif %}">Ward Management</a>
            <a href="/billing" class="btn btn-outline-light {% if active_page == 'billing' %}active{% endif %}">Billing & Payments</a>
            <a href="/staff" class="btn btn-outline-light {% if active_page == 'staff' %}active{% endif %}">Staff Management</a>
            <a href="/reports" class="btn btn-outline-light {% if active_page == 'reports' %}active{% endif %}">Reports & Analytics</a>
            <div class="mt-4">
                <button class="btn btn-success quick-action">Emergency Admission</button>
                <button class="btn btn-primary quick-action">New Patient</button>
            </div>
        </div>
        <div class="col-10 p-4">
            {% block content %}{% endblock %}
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
