{% extends 'base.html' %}
{% block content %}
<h2>{{ page_title }}</h2>
<table class="table">
    <thead><tr><th>Medicine</th><th>Stock</th></tr></thead>
    <tbody>
    {% for m in medicines %}
    <tr><td>{{ m.name }}</td><td>{{ m.stock }}</td></tr>
    {% endfor %}
    </tbody>
</table>
{% endblock %}
